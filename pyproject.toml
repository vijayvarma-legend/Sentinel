[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous Accounts Payable & Invoice Exception Handler"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "boto3>=1.35",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "httpx>=0.28",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "DTZ"]
ignore = ["ANN401", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106"]
# N818 wants every exception named `...Error`. The taxonomy deliberately names outcomes
# instead -- `raise ExecutionBlocked(...)` and `raise ExtractionRejected(...)` say what
# happened to the invoice, which is what a reader at the raise site needs to know.
"src/sentinel/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires docker-compose services (postgres, redis, minio)",
    "golden: the canonical PO 9901 / INV-8821 end-to-end case from spec section 15",
]

[tool.coverage.run]
source = ["src/sentinel"]

# ---------------------------------------------------------------------------
# Trust-class boundary enforcement -- ADR-0004.
# These contracts are the machine-checked form of the prime directive:
# no LLM output directly posts money.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["sentinel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "llm modules cannot reach ERP execution"
type = "forbidden"
source_modules = ["sentinel.extraction", "sentinel.reasoning"]
forbidden_modules = ["sentinel.erp"]

[[tool.importlinter.contracts]]
name = "llm modules cannot reach persistence write paths"
type = "forbidden"
source_modules = ["sentinel.extraction", "sentinel.reasoning"]
forbidden_modules = ["sentinel.db"]

[[tool.importlinter.contracts]]
name = "control modules cannot import llm modules"
type = "forbidden"
source_modules = ["sentinel.policy", "sentinel.erp", "sentinel.auth"]
forbidden_modules = ["sentinel.extraction", "sentinel.reasoning"]

[[tool.importlinter.contracts]]
name = "deterministic financial modules stay free of LLM SDKs"
type = "forbidden"
source_modules = [
    "sentinel.validation",
    "sentinel.duplicates",
    "sentinel.risk",
    "sentinel.policy",
    "sentinel.erp",
]
forbidden_modules = ["anthropic", "openai", "langchain_core", "langgraph"]

[[tool.importlinter.contracts]]
name = "core domain depends on nothing internal"
type = "forbidden"
source_modules = ["sentinel.core"]
forbidden_modules = [
    "sentinel.db",
    "sentinel.storage",
    "sentinel.graph",
    "sentinel.ingestion",
    "sentinel.extraction",
    "sentinel.validation",
    "sentinel.duplicates",
    "sentinel.risk",
    "sentinel.reasoning",
    "sentinel.policy",
    "sentinel.hitl",
    "sentinel.erp",
    "sentinel.audit",
    "sentinel.agentops",
]
